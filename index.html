<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Matemática 6º Ano - Jogo SAEB</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .pagina {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        /* ANÚNCIOS LATERAIS */
        .ads-side {
            flex: 0 0 160px;
            background: rgba(0,0,0,0.2);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .ad-card {
            background: white;
            border-radius: 15px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .ad-card:hover { transform: scale(1.02); box-shadow: 0 6px 15px rgba(0,0,0,0.2); }
        .ad-card img { width: 100%; max-height: 150px; object-fit: cover; border-radius: 10px; }
        .ad-card-title { font-weight: bold; color: #2c3e50; margin-top: 8px; font-size: 0.8rem; }
        .ad-card-desc { font-size: 0.7rem; color: #666; margin-top: 4px; }
        
        /* ANÚNCIOS TOPO E RODAPÉ (MOBILE) */
        .ad-top, .ad-bottom { width: 100%; max-width: 500px; margin: 0 auto; display: none; }
        .ad-banner { background: rgba(255,255,255,0.95); border-radius: 15px; padding: 10px; margin-bottom: 15px; text-align: center; cursor: pointer; transition: transform 0.3s; }
        .ad-banner:hover { transform: scale(1.02); }
        .ad-banner img { max-width: 100%; height: 60px; object-fit: contain; border-radius: 8px; }
        
        /* ÁREA DO JOGO + RANKING */
        .game-area {
            flex: 1;
            min-width: 300px;
            max-width: 500px;
        }
        
        /* CARD DO JOGO */
        .game-card {
            background: white;
            border-radius: 30px;
            padding: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            margin-bottom: 20px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .badge {
            padding: 8px 15px;
            border-radius: 25px;
            font-weight: bold;
        }
        .badge-level { background: #2c3e50; color: white; }
        .badge-score { background: #f1c40f; color: #333; }
        .badge-streak { background: #e74c3c; color: white; }
        
        .progress-area { margin-bottom: 20px; }
        .progress-bar { width: 100%; height: 10px; background: #eee; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: #27ae60; transition: width 0.5s; width: 0%; }
        .progress-text { font-size: 0.8rem; margin-top: 5px; color: #666; }
        
        .question-box {
            background: #f8f9fa;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
        }
        
        .question-text {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 20px;
            font-weight: 600;
        }
        
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .option {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s;
        }
        
        .option:hover { border-color: #3498db; transform: scale(1.02); }
        
        .option-letter {
            width: 40px;
            height: 40px;
            background: #2c3e50;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        
        .option-text { flex: 1; text-align: left; color: #333; }
        
        .option.selected {
            background: #3498db;
            border-color: #3498db;
        }
        .option.selected .option-text { color: white; }
        .option.selected .option-letter { background: white; color: #3498db; }
        
        .option.disabled {
            opacity: 0.7;
            cursor: not-allowed;
            pointer-events: none;
        }
        
        .option.correct-show {
            background: #27ae60;
            border-color: #27ae60;
        }
        .option.correct-show .option-text { color: white; }
        .option.correct-show .option-letter { background: white; color: #27ae60; }
        
        .option.wrong-show {
            background: #e74c3c;
            border-color: #e74c3c;
        }
        .option.wrong-show .option-text { color: white; }
        .option.wrong-show .option-letter { background: white; color: #e74c3c; }
        
        .lives {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }
        
        .heart { font-size: 1.8rem; }
        .heart.lost { opacity: 0.3; filter: grayscale(1); }
        
        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 15px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(0.98); }
        .btn-next { background: #27ae60; color: white; }
        .btn-next:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-restart { background: #3498db; color: white; }
        
        /* RANKING POR NÍVEL */
        .ranking-nivel {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .ranking-nivel h3 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }
        
        .tabs-ranking {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .tab-btn {
            background: #ecf0f1;
            border: none;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            margin-top: 0;
            width: auto;
        }
        
        .tab-btn:hover { transform: scale(1.05); background: #d5dbdb; }
        .tab-btn.ativo { background: #2c3e50; color: white; }
        
        .ranking-conteudo {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .rank-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #eee;
            transition: background 0.3s;
        }
        
        .rank-item:hover { background: #f8f9fa; }
        
        .rank-posicao {
            font-weight: bold;
            width: 45px;
            color: #2c3e50;
        }
        
        .rank-nome {
            flex: 2;
            font-weight: 600;
            color: #333;
        }
        
        .rank-pontos {
            font-weight: bold;
            color: #27ae60;
        }
        
        .rank-acertos {
            font-size: 0.8rem;
            color: #666;
            margin-left: 10px;
        }
        
        .medalha-1 { color: #f1c40f; }
        .medalha-2 { color: #95a5a6; }
        .medalha-3 { color: #cd7f32; }
        
        .sem-dados {
            text-align: center;
            color: #999;
            padding: 20px;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background: white;
            border-radius: 30px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }
        
        footer {
            margin-top: 30px;
            text-align: center;
            color: rgba(255,255,255,0.7);
            font-size: 0.8rem;
            cursor: pointer;
            padding: 15px;
        }
        
        @media (max-width: 900px) {
            .ads-side { display: none; }
            .ad-top, .ad-bottom { display: block; }
        }
        @media (min-width: 901px) {
            .ad-top, .ad-bottom { display: none !important; }
        }
    </style>
</head>
<body>
    <div class="pagina">
        <div class="container">
            <!-- ADS LATERAL ESQUERDA -->
            <div class="ads-side">
                <div class="ad-card" onclick="openAdLink('side1')">
                    <img id="ad1-img" src="https://via.placeholder.com/160x150?text=Anuncio">
                    <div class="ad-card-title" id="ad1-title">Anúncio 1</div>
                    <div class="ad-card-desc" id="ad1-desc">Divulgue seu negócio</div>
                </div>
                <div class="ad-card" onclick="openAdLink('side2')">
                    <img id="ad2-img" src="https://via.placeholder.com/160x150?text=Anuncio">
                    <div class="ad-card-title" id="ad2-title">Anúncio 2</div>
                    <div class="ad-card-desc" id="ad2-desc">Divulgue seu negócio</div>
                </div>
            </div>
            
            <!-- ÁREA DO JOGO + RANKING -->
            <div class="game-area">
                <!-- ANÚNCIO TOPO (MOBILE) -->
                <div class="ad-top">
                    <div class="ad-banner" onclick="openAdLink('top')">
                        <img id="top-img" src="https://via.placeholder.com/468x60?text=Anuncio">
                    </div>
                </div>
                
                <!-- JOGO -->
                <div class="game-card">
                    <div class="header">
                        <div class="badge badge-level" id="levelDisplay">📚 Nível 1</div>
                        <div class="badge badge-score" id="scoreDisplay">⭐ 0 pts</div>
                        <div class="badge badge-streak" id="streakDisplay">🔥 0</div>
                    </div>
                    
                    <div class="progress-area">
                        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
                        <div class="progress-text" id="progressText">Questão 1 de 10</div>
                    </div>
                    
                    <div class="lives" id="livesContainer">❤️ ❤️ ❤️</div>
                    
                    <div class="question-box">
                        <div class="question-text" id="questionText">Carregando...</div>
                        <div class="options" id="optionsContainer"></div>
                    </div>
                    
                    <button class="btn-next" id="nextBtn" onclick="proximaQuestao()" disabled>▶ PRÓXIMA</button>
                    <button class="btn-restart" onclick="reiniciarJogo()">🔄 RECOMEÇAR JOGO</button>
                </div>
                
                <!-- RANKING POR NÍVEL -->
                <div class="ranking-nivel">
                    <h3>🏆 RANKING POR NÍVEL 🏆</h3>
                    <div class="tabs-ranking">
                        <button class="tab-btn" onclick="mostrarRankingNivel(1, this)">Nível 1</button>
                        <button class="tab-btn" onclick="mostrarRankingNivel(2, this)">Nível 2</button>
                        <button class="tab-btn" onclick="mostrarRankingNivel(3, this)">Nível 3</button>
                        <button class="tab-btn" onclick="mostrarRankingNivel(4, this)">Nível 4</button>
                        <button class="tab-btn" onclick="mostrarRankingNivel(5, this)">Nível 5</button>
                        <button class="tab-btn" onclick="mostrarRankingNivel(6, this)">Nível 6</button>
                        <button class="tab-btn" onclick="mostrarRankingNivel(7, this)">Nível 7</button>
                        <button class="tab-btn" onclick="mostrarRankingNivel(8, this)">Nível 8</button>
                        <button class="tab-btn" onclick="mostrarRankingNivel(9, this)">Nível 9</button>
                        <button class="tab-btn" onclick="mostrarRankingNivel(10, this)">Nível 10</button>
                    </div>
                    <div class="ranking-conteudo" id="rankingConteudo">
                        <div class="sem-dados">Selecione um nível</div>
                    </div>
                </div>
                
                <!-- ANÚNCIO RODAPÉ (MOBILE) -->
                <div class="ad-bottom">
                    <div class="ad-banner" onclick="openAdLink('bottom')">
                        <img id="bottom-img" src="https://via.placeholder.com/468x60?text=Anuncio">
                    </div>
                </div>
            </div>
            
            <!-- ADS LATERAL DIREITA -->
            <div class="ads-side">
                <div class="ad-card" onclick="openAdLink('side3')">
                    <img id="ad3-img" src="https://via.placeholder.com/160x150?text=Anuncio">
                    <div class="ad-card-title" id="ad3-title">Anúncio 3</div>
                    <div class="ad-card-desc" id="ad3-desc">Divulgue seu negócio</div>
                </div>
                <div class="ad-card" onclick="openAdLink('side4')">
                    <img id="ad4-img" src="https://via.placeholder.com/160x150?text=Anuncio">
                    <div class="ad-card-title" id="ad4-title">Anúncio 4</div>
                    <div class="ad-card-desc" id="ad4-desc">Divulgue seu negócio</div>
                </div>
            </div>
        </div>
        
        <footer onclick="abrirAdmin()">© 2026 | Clique para Configurar Anúncios</footer>
    </div>
    
    <!-- MODAL GAME OVER -->
    <div id="gameoverModal" class="modal">
        <div class="modal-content">
            <h2 id="gameoverTitle">🎉 PARABÉNS!</h2>
            <p id="gameoverText"></p>
            <p id="gameoverStats"></p>
            <button onclick="reiniciarJogo()">JOGAR NOVAMENTE</button>
        </div>
    </div>

    <script>
        // ========== BANCO DE QUESTÕES ==========
        const bancoQuestoes = {
            1: [
                { texto: "25 + 37 = ?", a: "52", b: "62", c: "72", d: "82", correta: "b" },
                { texto: "8 × 7 = ?", a: "48", b: "56", c: "64", d: "72", correta: "b" },
                { texto: "O dobro de 15 é:", a: "25", b: "30", c: "35", d: "40", correta: "b" },
                { texto: "3² é igual a:", a: "6", b: "8", c: "9", d: "12", correta: "c" },
                { texto: "10 - 4 × 2 = ?", a: "12", b: "8", c: "2", d: "6", correta: "c" },
                { texto: "A metade de 50 é:", a: "20", b: "25", c: "30", d: "35", correta: "b" },
                { texto: "Qual o sucessor de 199?", a: "198", b: "200", c: "201", d: "210", correta: "b" },
                { texto: "1000 ÷ 10 = ?", a: "10", b: "100", c: "1000", d: "1", correta: "b" },
                { texto: "Uma dúzia equivale a:", a: "10", b: "11", c: "12", d: "13", correta: "c" },
                { texto: "5 × 0 = ?", a: "0", b: "5", c: "10", d: "1", correta: "a" },
                { texto: "9 + 8 = ?", a: "15", b: "16", c: "17", d: "18", correta: "c" },
                { texto: "15 - 7 = ?", a: "6", b: "7", c: "8", d: "9", correta: "c" },
                { texto: "4 × 6 = ?", a: "20", b: "22", c: "24", d: "26", correta: "c" },
                { texto: "30 ÷ 5 = ?", a: "5", b: "6", c: "7", d: "8", correta: "b" }
            ],
            2: [
                { texto: "144 ÷ 12 = ?", a: "10", b: "11", c: "12", d: "13", correta: "c" },
                { texto: "2³ + 3² = ?", a: "13", b: "15", c: "17", d: "19", correta: "c" },
                { texto: "Raiz quadrada de 64 é:", a: "6", b: "7", c: "8", d: "9", correta: "c" },
                { texto: "35% de 200 = ?", a: "50", b: "60", c: "70", d: "80", correta: "c" },
                { texto: "MMC de 4 e 6 é:", a: "8", b: "10", c: "12", d: "14", correta: "c" },
                { texto: "Área do quadrado de lado 7cm:", a: "28cm²", b: "42cm²", c: "49cm²", d: "56cm²", correta: "c" },
                { texto: "2/5 em decimal é:", a: "0,2", b: "0,25", c: "0,4", d: "0,5", correta: "c" },
                { texto: "50 + 30 × 2 = ?", a: "110", b: "130", c: "160", d: "100", correta: "a" },
                { texto: "0,5 em fração é:", a: "1/3", b: "1/2", c: "2/3", d: "3/4", correta: "b" },
                { texto: "Uma dúzia e meia:", a: "12", b: "15", c: "18", d: "24", correta: "c" }
            ],
            3: [
                { texto: "3 × (4 + 7) - 2³ = ?", a: "25", b: "29", c: "33", d: "37", correta: "a" },
                { texto: "x + 12 = 30 → x = ?", a: "12", b: "15", c: "18", d: "20", correta: "c" },
                { texto: "0,75 em fração:", a: "3/4", b: "2/3", c: "1/2", d: "4/5", correta: "a" },
                { texto: "MDC de 18 e 24:", a: "3", b: "4", c: "6", d: "8", correta: "c" },
                { texto: "√81 + 2² = ?", a: "11", b: "12", c: "13", d: "14", correta: "c" },
                { texto: "Perímetro retângulo 5×3:", a: "15cm", b: "16cm", c: "18cm", d: "20cm", correta: "b" },
                { texto: "25% de R$200:", a: "R$25", b: "R$50", c: "R$75", d: "R$100", correta: "b" },
                { texto: "Ângulo reto mede:", a: "45°", b: "60°", c: "90°", d: "180°", correta: "c" },
                { texto: "2³ × 2² = ?", a: "2⁵", b: "2⁶", c: "2⁴", d: "2³", correta: "a" },
                { texto: "3/4 é maior que:", a: "1/2", b: "1/3", c: "1/4", d: "Todas", correta: "d" }
            ]
        };
        
        // Níveis 4-10
        for(let n = 4; n <= 10; n++) {
            bancoQuestoes[n] = [];
            for(let i = 1; i <= 20; i++) {
                bancoQuestoes[n].push({
                    texto: `Desafio ${i} do Nível ${n}`,
                    a: `Opção A${i}`, b: `Opção B${i}`, c: `Opção C${i}`, d: `Opção D${i}`,
                    correta: ["a","b","c","d"][Math.floor(Math.random() * 4)]
                });
            }
        }
        
        // ========== EMBARALHAMENTO ==========
        function embaralhar(array) {
            for(let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }
        
        // ========== RANKING POR NÍVEL ==========
        let rankingNivel = JSON.parse(localStorage.getItem('rankingNivel')) || {};
        
        function salvarProgressoNivel(nivel, acertos, total, pontuacaoFinal) {
            if(!rankingNivel[nivel]) rankingNivel[nivel] = [];
            
            const percentual = Math.round((acertos / total) * 100);
            
            rankingNivel[nivel].push({
                nome: nomeJogador,
                acertos: acertos,
                total: total,
                percentual: percentual,
                pontuacao: pontuacaoFinal,
                data: new Date().toISOString()
            });
            
            rankingNivel[nivel].sort((a, b) => {
                if(b.percentual !== a.percentual) return b.percentual - a.percentual;
                return b.pontuacao - a.pontuacao;
            });
            
            rankingNivel[nivel] = rankingNivel[nivel].slice(0, 15);
            localStorage.setItem('rankingNivel', JSON.stringify(rankingNivel));
        }
        
        function mostrarRankingNivel(nivel, botao) {
            // Atualizar abas
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('ativo'));
            if(botao) botao.classList.add('ativo');
            
            const dados = rankingNivel[nivel] || [];
            const container = document.getElementById('rankingConteudo');
            
            if(dados.length === 0) {
                container.innerHTML = '<div class="sem-dados">🎯 Nenhum jogador ainda neste nível!</div>';
                return;
            }
            
            let html = '';
            dados.forEach((item, idx) => {
                let medalha = '';
                if(idx === 0) medalha = '🥇 ';
                else if(idx === 1) medalha = '🥈 ';
                else if(idx === 2) medalha = '🥉 ';
                else medalha = `${idx+1}º `;
                
                html += `
                    <div class="rank-item">
                        <div class="rank-posicao">${medalha}</div>
                        <div class="rank-nome">${item.nome}</div>
                        <div class="rank-pontos">${item.percentual}%</div>
                        <div class="rank-acertos">(${item.acertos}/${item.total})</div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }
        
        // ========== VARIÁVEIS DO JOGO ==========
        let nivelAtual = 1;
        let questoesNivel = [];
        let indiceQuestao = 0;
        let pontuacao = 0;
        let sequencia = 0;
        let vidas = 3;
        let alternativaSelecionada = null;
        let processando = false;
        let nomeJogador = "";
        let acertosNivel = 0;
        let totalQuestoesNivel = 0;
        
        // ========== FUNÇÕES DO JOGO ==========
        function iniciarJogo() {
            nomeJogador = prompt("Digite seu nome para começar:") || "Jogador";
            if(nomeJogador.trim() === "") nomeJogador = "Jogador";
            carregarNivel(1);
        }
        
        function carregarNivel(nivel) {
            nivelAtual = nivel;
            acertosNivel = 0;
            
            let banco = bancoQuestoes[nivel] || [];
            if(banco.length === 0) {
                for(let i = 1; i <= 20; i++) {
                    banco.push({
                        texto: `Questão ${i} do Nível ${nivel}`,
                        a: "Alternativa A", b: "Alternativa B", c: "Alternativa C", d: "Alternativa D",
                        correta: ["a","b","c","d"][Math.floor(Math.random() * 4)]
                    });
                }
            }
            
            const bancoEmbaralhado = embaralhar([...banco]);
            questoesNivel = bancoEmbaralhado.slice(0, 10);
            totalQuestoesNivel = questoesNivel.length;
            
            indiceQuestao = 0;
            vidas = 3;
            sequencia = 0;
            alternativaSelecionada = null;
            processando = false;
            
            atualizarUI();
            carregarQuestao();
        }
        
        function carregarQuestao() {
            if(indiceQuestao >= questoesNivel.length) {
                salvarProgressoNivel(nivelAtual, acertosNivel, totalQuestoesNivel, pontuacao);
                if(nivelAtual < 10) {
                    carregarNivel(nivelAtual + 1);
                } else {
                    finalizarJogo(true);
                }
                return;
            }
            
            const q = questoesNivel[indiceQuestao];
            document.getElementById('questionText').innerHTML = q.texto;
            
            const container = document.getElementById('optionsContainer');
            container.innerHTML = `
                <div class="option" data-letra="a">
                    <div class="option-letter">A</div>
                    <div class="option-text">${q.a}</div>
                </div>
                <div class="option" data-letra="b">
                    <div class="option-letter">B</div>
                    <div class="option-text">${q.b}</div>
                </div>
                <div class="option" data-letra="c">
                    <div class="option-letter">C</div>
                    <div class="option-text">${q.c}</div>
                </div>
                <div class="option" data-letra="d">
                    <div class="option-letter">D</div>
                    <div class="option-text">${q.d}</div>
                </div>
            `;
            
            document.querySelectorAll('.option').forEach(opt => {
                opt.onclick = () => selecionarAlternativa(opt);
            });
            
            alternativaSelecionada = null;
            processando = false;
            
            document.querySelectorAll('.option').forEach(opt => {
                opt.classList.remove('selected', 'disabled', 'correct-show', 'wrong-show');
            });
            
            document.getElementById('nextBtn').disabled = true;
            
            const progresso = (indiceQuestao / questoesNivel.length) * 100;
            document.getElementById('progressFill').style.width = progresso + "%";
            document.getElementById('progressText').innerHTML = `Questão ${indiceQuestao + 1} de ${questoesNivel.length}`;
        }
        
        function selecionarAlternativa(opt) {
            if(processando) return;
            if(alternativaSelecionada) {
                alternativaSelecionada.classList.remove('selected');
            }
            alternativaSelecionada = opt;
            opt.classList.add('selected');
            document.getElementById('nextBtn').disabled = false;
        }
        
        function proximaQuestao() {
            if(processando) return;
            if(!alternativaSelecionada) return;
            
            processando = true;
            
            const q = questoesNivel[indiceQuestao];
            const letraSelecionada = alternativaSelecionada.getAttribute('data-letra');
            const acertou = (letraSelecionada === q.correta);
            
            let textoCorreto = "";
            document.querySelectorAll('.option').forEach(opt => {
                if(opt.getAttribute('data-letra') === q.correta) {
                    textoCorreto = opt.querySelector('.option-text').innerHTML;
                }
            });
            
            document.querySelectorAll('.option').forEach(opt => {
                opt.classList.add('disabled');
                if(opt.getAttribute('data-letra') === q.correta) {
                    opt.classList.add('correct-show');
                }
                if(opt === alternativaSelecionada && !acertou) {
                    opt.classList.add('wrong-show');
                }
            });
            
            if(acertou) {
                acertosNivel++;
                sequencia++;
                const pontos = 10 + (sequencia * 2);
                pontuacao += pontos;
                mostrarFeedback(`✅ ACERTOU! +${pontos} pontos!`, "#27ae60");
                confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
            } else {
                sequencia = 0;
                vidas--;
                atualizarVidas();
                mostrarFeedback(`❌ ERROU! Resposta: ${q.correta.toUpperCase()}) ${textoCorreto}`, "#e74c3c");
                
                if(vidas <= 0) {
                    salvarProgressoNivel(nivelAtual, acertosNivel, totalQuestoesNivel, pontuacao);
                    setTimeout(() => finalizarJogo(false), 2000);
                    return;
                }
            }
            
            atualizarUI();
            
            setTimeout(() => {
                indiceQuestao++;
                processando = false;
                carregarQuestao();
            }, 2500);
        }
        
        function atualizarUI() {
            document.getElementById('levelDisplay').innerHTML = `📚 Nível ${nivelAtual}`;
            document.getElementById('scoreDisplay').innerHTML = `⭐ ${pontuacao} pts`;
            document.getElementById('streakDisplay').innerHTML = `🔥 ${sequencia}`;
            atualizarVidas();
        }
        
        function atualizarVidas() {
            const container = document.getElementById('livesContainer');
            let hearts = '';
            for(let i = 0; i < 3; i++) {
                hearts += `<span class="heart ${i >= vidas ? 'lost' : ''}">${i < vidas ? '❤️' : '🖤'}</span>`;
            }
            container.innerHTML = hearts;
        }
        
        function mostrarFeedback(msg, cor) {
            const div = document.createElement('div');
            div.style.cssText = `
                position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
                background: ${cor}; color: white; padding: 15px 25px;
                border-radius: 25px; z-index: 2000; font-weight: bold;
                font-size: 1rem; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            `;
            div.innerHTML = msg;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 2500);
        }
        
        function finalizarJogo(completou) {
            if(completou) {
                document.getElementById('gameoverTitle').innerHTML = "🎉 PARABÉNS! 🎉";
                document.getElementById('gameoverText').innerHTML = "Você completou todos os 10 níveis!";
                document.getElementById('gameoverStats').innerHTML = `Pontuação final: ${pontuacao} pontos<br>🏆 Mestre da Matemática! 🏆`;
                confetti({ particleCount: 500, spread: 150, origin: { y: 0.5 } });
            } else {
                document.getElementById('gameoverTitle').innerHTML = "💀 GAME OVER 💀";
                document.getElementById('gameoverText').innerHTML = `Você não passou do Nível ${nivelAtual}!`;
                document.getElementById('gameoverStats').innerHTML = `Pontuação final: ${pontuacao} pontos`;
            }
            document.getElementById('gameoverModal').style.display = 'flex';
        }
        
        function reiniciarJogo() {
            pontuacao = 0;
            sequencia = 0;
            document.getElementById('gameoverModal').style.display = 'none';
            carregarNivel(1);
        }
        
        // ========== ANÚNCIOS ==========
        function openAdLink(pos) {
            const links = JSON.parse(localStorage.getItem('ad_links')) || {};
            const link = links[pos] || "#";
            if(link !== "#") {
                window.open(link, '_blank');
            } else {
                alert("Anúncio não configurado. Clique no rodapé para configurar.");
            }
        }
        
        function carregarAnuncios() {
            const ads = JSON.parse(localStorage.getItem('ads_config')) || {};
            
            // Configurar anúncios laterais
            for(let i = 1; i <= 4; i++) {
                const ad = ads[`side${i}`] || {};
                const img = document.getElementById(`ad${i}-img`);
                const title = document.getElementById(`ad${i}-title`);
                const desc = document.getElementById(`ad${i}-desc`);
                if(img) img.src = ad.img || `https://via.placeholder.com/160x150?text=Anuncio+${i}`;
                if(title) title.innerHTML = ad.title || `Anúncio ${i}`;
                if(desc) desc.innerHTML = ad.desc || "Divulgue seu negócio";
            }
            
            // Configurar anúncio topo
            const topAd = ads['top'] || {};
            const topImg = document.getElementById('top-img');
            if(topImg) topImg.src = topAd.img || "https://via.placeholder.com/468x60?text=Anuncio+Topo";
            
            // Configurar anúncio rodapé
            const bottomAd = ads['bottom'] || {};
            const bottomImg = document.getElementById('bottom-img');
            if(bottomImg) bottomImg.src = bottomAd.img || "https://via.placeholder.com/468x60?text=Anuncio+Rodape";
        }
        
        function abrirAdmin() {
            const senha = prompt("Senha do administrador:");
            if(senha === "Admin2024") {
                const pos = prompt("Configurar anúncio:\n1 - Lateral Esq1\n2 - Lateral Esq2\n3 - Topo\n4 - Rodapé\n5 - Lateral Dir1\n6 - Lateral Dir2\n\nDigite o número:");
                const posMap = {1:'side1',2:'side2',3:'top',4:'bottom',5:'side3',6:'side4'};
                const position = posMap[pos];
                if(position) {
                    const imgUrl = prompt("URL da imagem (ex: https://exemplo.com/imagem.jpg):");
                    const linkUrl = prompt("URL de destino (ex: https://instagram.com/...):");
                    const title = prompt("Título do anúncio:");
                    const desc = prompt("Descrição curta:");
                    const ads = JSON.parse(localStorage.getItem('ads_config')) || {};
                    ads[position] = { img: imgUrl, link: linkUrl, title: title, desc: desc };
                    localStorage.setItem('ads_config', JSON.stringify(ads));
                    const links = JSON.parse(localStorage.getItem('ad_links')) || {};
                    links[position] = linkUrl;
                    localStorage.setItem('ad_links', JSON.stringify(links));
                    alert("Anúncio salvo! Recarregue a página.");
                    location.reload();
                }
            } else if(senha !== null) {
                alert("Senha incorreta!");
            }
        }
        
        // Inicialização
        window.onload = () => {
            carregarAnuncios();
            iniciarJogo();
            // Selecionar primeiro nível do ranking
            const primeiroBotao = document.querySelector('.tab-btn');
            if(primeiroBotao) {
                primeiroBotao.classList.add('ativo');
                mostrarRankingNivel(1, primeiroBotao);
            }
        };
    </script>
</body>
</html>
